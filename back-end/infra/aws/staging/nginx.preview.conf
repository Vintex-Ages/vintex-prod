# Preview atrás do CloudFront. deploy_staging.py troca __ORIGIN_VERIFY__ pelo
# segredo do SSM (/vintex/staging/origin_verify) e grava o resultado no
# diretório de segredos do release, nunca no repositório.
limit_req_zone $binary_remote_addr zone=api_limit:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;
    limit_req_status 429;
    # Avoid logging query strings (presigned media URLs) or authorization.
    access_log off;
    # Atrás do CloudFront o IP do cliente vem em X-Forwarded-For (o último valor
    # é o que o próprio CloudFront anexou). Só a lista gerenciada do CloudFront
    # alcança a porta 80, então confiar no cabeçalho é seguro.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location = /health {
        proxy_pass http://api:8000/health;
    }
    # Cadastro público fechado; as contas de demo são criadas dentro da
    # instância, sem passar pelo Nginx.
    location ~ ^/api/auth/register/*$ {
        default_type application/json;
        return 403 '{"error":{"code":"REGISTRATION_CLOSED","message":"Cadastro fechado nesta staging."}}';
    }
    location ~ ^/api(?:/|$) {
        if ($http_x_origin_verify != "__ORIGIN_VERIFY__") { return 403; }
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;  # o CloudFront só entrega HTTPS (redirect-to-https)
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location = /index.html {
        if ($http_x_origin_verify != "__ORIGIN_VERIFY__") { return 403; }
        add_header Cache-Control "no-store" always;
    }
    location / {
        if ($http_x_origin_verify != "__ORIGIN_VERIFY__") { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
