name: Close Guard

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to run the guard against"
        required: true
      dry_run:
        description: "Log the intended action without reopening/restoring anything"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vintex-project-automation-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  guard:
    if: vars.GPA_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GPA_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPA_APP_PRIVATE_KEY }}
          owner: Vintex-Ages
          repositories: front-end
      - run: node .github/scripts/close-guard.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_ORG: Vintex-Ages
          SOURCE_PROJECT_NUMBER: 3
          AGGREGATE_PROJECT_NUMBER: 2
          ISSUE_NUMBER_OVERRIDE: ${{ github.event.inputs.issue_number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
