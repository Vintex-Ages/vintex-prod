name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
