name: CI

on:
  push:
    branches: [main, develop, deploy]
  pull_request:
    branches: [main, develop, deploy]
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: CI audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit all dependencies
        run: pnpm audit --audit-level high

  quality:
    name: CI quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm exec tsc --noEmit
      - name: Test application
        run: pnpm test
      - name: Test automation scripts
        run: node --test .github/scripts/lib/*.tests.mjs
      - name: Test coverage
        run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Preserve the existing required context until every protected branch uses the new checks.
  # A skipped dependent job counts as successful for branch protection, so run it after failures.
  legacy-required-check:
    name: Lint, type-check, test & build
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [audit, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require audit and quality
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$AUDIT_RESULT" = success
          test "$QUALITY_RESULT" = success
