name: Project Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, milestoned, demilestoned]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: vintex-project-automation-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.GPA_APP_CLIENT_ID != '' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GPA_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPA_APP_PRIVATE_KEY }}
          owner: Vintex-Ages
          repositories: front-end
      - run: node .github/scripts/project-sync.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_ORG: Vintex-Ages
          SOURCE_PROJECT_NUMBER: 3
          AGGREGATE_PROJECT_NUMBER: 2
