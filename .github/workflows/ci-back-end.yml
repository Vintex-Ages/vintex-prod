name: CI back-end

# Portado do ci.yml do repositório back-end. Fica inativo (a detecção de mudanças
# desliga o componente) enquanto back-end/requirements.txt não existir neste repo.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: back-end

jobs:
  lint:
    name: back-end lint & format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run Ruff (linter)
        run: ruff check .
      - name: Check Black (formatting)
        run: black --check .

  audit:
    name: back-end security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pip-audit
        run: pip-audit

  type-check:
    name: back-end type check
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  migrations:
    name: back-end migrations
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector/pgvector:pg16 — ver back-end/docker-compose.yml (BE-US027-1, back-end#92)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vintex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vintex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Assert a single Alembic head
        run: |
          alembic heads
          count=$(alembic heads | grep -c '(head)' || true)
          echo "Alembic heads encontradas: $count"
          test "$count" -eq 1
      - name: Apply migrations (empty DB -> head)
        run: alembic upgrade head
      - name: Check migrations are reversible
        run: alembic downgrade base

  test:
    name: back-end tests
    if: github.event_name != 'schedule'
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  test-postgres:
    name: back-end tests (Postgres)
    if: github.event_name != 'schedule'
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Esta fixture roda `alembic upgrade head` (via pg_engine/tests/conftest.py) e a
        # cadeia de migrations inclui `CREATE EXTENSION vector` (BE-US027-1, back-end#92):
        # mesma imagem do job `migrations`, mesmo motivo.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vintex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/vintex_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run Postgres-only tests
        run: pytest tests/ -v -m postgres

  docker:
    name: back-end docker build
    if: github.event_name != 'schedule'
    needs: [test, test-postgres, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t vintex-backend:${{ github.sha }} .
