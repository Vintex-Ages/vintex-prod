name: CI

# feature -> develop : valida só o componente cuja pasta mudou (front-end/, back-end/, ...;
#                      ver .github/config/ci-paths.json). Documentação não roda testes e o
#                      front-end roda apenas os testes afetados (ver ci-front-end.yml).
# develop -> qa, qa -> main, main -> deploy, push e agenda : valida tudo
# Jobs de infra (ci-infra.yml) rodam apenas em PR para `qa`.
# O único check a exigir no ruleset é o "CI gate": workflows filtrados por caminho
# deixam checks obrigatórios pendentes para sempre quando não rodam.

on:
  push:
    branches: [develop, qa, main, deploy]
  pull_request:
    branches: [develop, qa, main, deploy]
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      front_end: ${{ steps.detect.outputs.front_end }}
      back_end: ${{ steps.detect.outputs.back_end }}
      infra: ${{ steps.detect.outputs.infra }}
      automation: ${{ steps.detect.outputs.automation }}
      docs: ${{ steps.detect.outputs.docs }}
      front_end_scope: ${{ steps.detect.outputs.front_end_scope }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: node .github/scripts/detect-changes.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  front-end:
    name: front-end
    needs: changes
    if: needs.changes.outputs.front_end == 'true'
    uses: ./.github/workflows/ci-front-end.yml
    with:
      scope: ${{ needs.changes.outputs.front_end_scope }}
      base_sha: ${{ needs.changes.outputs.base_sha }}

  back-end:
    name: back-end
    needs: changes
    if: needs.changes.outputs.back_end == 'true'
    uses: ./.github/workflows/ci-back-end.yml

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read
      id-token: write # llm-key assume o role AWS por OIDC

  automation:
    name: Automation scripts
    needs: changes
    if: needs.changes.outputs.automation == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test automation scripts
        run: node --test .github/scripts/lib/*.test.mjs .github/scripts/lib/*.tests.mjs

  gate:
    name: ${{ matrix.check }}
    strategy:
      matrix:
        # "Front-end CI" e "Back-end CI" mantêm os rulesets ao vivo satisfeitos até a
        # troca para o CI gate (config/governance/rulesets); depois, remover os dois.
        check: [CI gate, Front-end CI, Back-end CI]
    # Um job pulado conta como sucesso para a proteção de branch; por isso o gate roda
    # sempre e falha explicitamente se qualquer job executado não tiver passado.
    if: ${{ always() }}
    needs: [changes, front-end, back-end, infra, automation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every executed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          test "$(echo "$NEEDS" | jq -r '.changes.result')" = success
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Jobs que não passaram: $failed"
            exit 1
          fi
