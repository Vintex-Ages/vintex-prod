name: Back-end CI

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: back-end

jobs:
  # Escopo por tipo de PR:
  #   feature -> develop : só o que mudou (app e/ou infra, por caminho)
  #   develop -> qa      : todos os testes da aplicação
  #   qa -> main         : todos os testes de infra
  #   push / manual      : tudo
  changes:
    name: Detect back-end changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          emit() { echo "app=$1" >> "$GITHUB_OUTPUT"; echo "infra=$2" >> "$GITHUB_OUTPUT"; echo "app=$1 infra=$2"; }
          if [ "$EVENT" != "pull_request" ]; then emit true true; exit 0; fi
          case "$BASE_REF" in
            qa) emit true false; exit 0 ;;
            main) emit false true; exit 0 ;;
            develop) ;;
            *) emit true true; exit 0 ;;
          esac
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          echo "$files"
          app=false; infra=false
          if echo "$files" | grep -qE '^(back-end/|\.github/workflows/back-end-ci\.yml$)'; then app=true; fi
          if echo "$files" | grep -qE '^(back-end/(infra/|scripts/infra/|tests/staging/|Makefile$)|\.github/workflows/back-end-ci\.yml$)'; then infra=true; fi
          emit "$app" "$infra"

  staging-runtime:
    name: Staging Runtime Validation
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test real Nginx against synthetic backend
        run: python3 scripts/infra/test_staging_proxy.py
      - name: Test IMDS guard in isolated container namespaces
        run: |
          docker build -f tests/staging/Dockerfile.imds -t vintex-staging-imds:test .
          docker run --rm --privileged --network none vintex-staging-imds:test
  terraform:
    name: Terraform Validation
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
      - name: Check Terraform formatting
        run: make terraform-fmt
      - name: Validate and test local, bootstrap and AWS without credentials
        run: |
          for environment in local bootstrap staging; do
            make terraform-validate "$environment"
            make terraform-test "$environment"
          done
  lint:
    name: Lint & Format
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Ruff (linter)
        run: ruff check .
      - name: Check Black (formatting)
        run: black --check .
  audit:
    name: Security Audit
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pip-audit
        run: pip-audit
  type-check:
    name: Type Check
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mypy
        run: mypy app/ --ignore-missing-imports
  migrations:
    name: Migrations
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # pgvector/pgvector:pg16: ver back-end/docker-compose.yml (BE-US027-1, back-end#92)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vintex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vintex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Assert a single Alembic head
        run: |
          alembic heads
          count=$(alembic heads | grep -c '(head)' || true)
          echo "Alembic heads encontradas: $count"
          test "$count" -eq 1
      - name: Apply migrations (empty DB -> head)
        run: alembic upgrade head
      - name: Check migrations are reversible
        run: alembic downgrade base
  test:
    name: Tests
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
  test-postgres:
    name: Tests (Postgres)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # pgvector/pgvector:pg16: a fixture roda `alembic upgrade head`, e a cadeia inclui CREATE EXTENSION vector (BE-US027-1, back-end#92)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vintex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/vintex_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Postgres-only tests
        run: pytest tests/ -v -m postgres
  docker:
    name: Build Docker Image
    needs:
      - changes
      - lint
      - audit
      - type-check
      - migrations
      - test
      - test-postgres
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t vintex-backend:${{ github.sha }} .

  # Agregador para a proteção de branch. Roda em todo PR (sem filtro de caminho),
  # então o contexto exigido é sempre reportado.
  back-end-ci:
    name: Back-end CI
    if: ${{ always() }}
    needs: [changes, staging-runtime, terraform, lint, audit, type-check, migrations, test, test-postgres, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require all back-end jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          test "$(echo "$NEEDS" | jq -r '.changes.result')" = success
          # Jobs dispensados pelo escopo do PR ficam "skipped"; só falha ou cancelamento reprova.
          test "$(echo "$NEEDS" | jq -r '[.[] | select(.result == "failure" or .result == "cancelled")] | length')" = 0
