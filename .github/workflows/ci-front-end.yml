name: CI front-end

# Fluxo: static (lint, formatação, tipos) roda primeiro e sempre; se passar, test, coverage,
# build e audit rodam em paralelo.
#
# Escopo dos testes (decidido em detect-changes.mjs):
#   all     : suíte completa (promoções para qa/main/deploy, push, agenda, ou mudança em
#             arquivo sem teste identificável, como package.json e configs)
#   changed : só os testes afetados pelas mudanças do PR (grafo de módulos do vitest);
#             se o vitest não identificar nenhum teste, roda a suíte completa.
# `coverage` roda só em scope=all. Nesse caso a suíte roda duas vezes ao mesmo tempo (test e
# coverage), trocando minutos de runner por tempo de relógio. Na agenda só rodam static e audit.
on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: all
      base_sha:
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: front-end

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-front-end
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm exec tsc --noEmit

  test:
    name: Test application
    needs: static
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # `vitest --changed <base_sha>` precisa do histórico do PR
          persist-credentials: false
      - uses: ./.github/actions/setup-front-end
      - name: Select tests
        id: select
        env:
          SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          mode=all
          if [ "$SCOPE" = "changed" ] && [ -n "$BASE_SHA" ]; then
            list=$(pnpm exec vitest list --filesOnly --changed "$BASE_SHA" 2>/dev/null \
              | grep -E '\.(test|spec)\.[cm]?[jt]sx?$' || true)
            if [ -n "$list" ]; then
              mode=changed
              echo "Testes afetados:"; echo "$list"
            else
              echo "::notice::Nenhum teste identificado para as mudanças; rodando a suíte completa."
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Test affected tests
        if: steps.select.outputs.mode == 'changed'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: pnpm exec vitest run --changed "$BASE_SHA" --maxWorkers=2
      - name: Test application
        if: steps.select.outputs.mode == 'all'
        run: pnpm test

  coverage:
    name: Test coverage
    needs: static
    if: github.event_name != 'schedule' && inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-front-end
      - name: Test coverage
        run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: front-end-coverage-report
          path: front-end/coverage
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build
    needs: static
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-front-end
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: front-end-dist
          path: front-end/dist
          retention-days: 7

  audit:
    name: Audit
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-front-end
      - name: Audit all dependencies
        run: pnpm audit --audit-level high
