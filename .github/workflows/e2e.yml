name: E2E

on:
  pull_request:
    branches: [main, develop, qa]
    paths:
      - 'e2e/**'
      - 'front-end/**'
      - 'back-end/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vintex
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vintex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/vintex
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-2
      MEDIA_BUCKET: vintex-local-media
      S3_ENDPOINT_URL: http://127.0.0.1:9001
      # Determinístico: nenhuma chamada real de IA no CI.
      AI_PROVIDER: fake
      CHAT_QUOTA_PER_PERSON: '100'
      CHAT_QUOTA_PER_DAY: '1000'
      # O runner tem pnpm no PATH; localmente o config cai no corepack.
      E2E_WEB_COMMAND: pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Instalar dependências do back-end
        working-directory: back-end
        run: pip install -r requirements.txt 'moto[server]'

      - name: Migrations e seeds
        working-directory: back-end
        run: |
          alembic upgrade head
          python -m app.seeds.lojas
          python -m app.seeds.pecas
          python -m app.seeds.admin
          python -m app.seeds.legal
          # Sem embeddings o chat e a busca por foto devolvem lista vazia.
          python -m scripts.backfill_embeddings

      - name: Subir S3 de teste (moto) e criar o bucket
        working-directory: back-end
        run: |
          nohup python -m moto.server -H 127.0.0.1 -p 9001 > /tmp/moto.log 2>&1 &
          python - <<'PY'
          import socket, time
          for _ in range(60):
              try:
                  socket.create_connection(('127.0.0.1', 9001), timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('moto não subiu')
          PY
          python - <<'PY'
          import boto3
          from botocore.config import Config
          client = boto3.client(
              's3', endpoint_url='http://127.0.0.1:9001', region_name='us-east-2',
              aws_access_key_id='test', aws_secret_access_key='test',
              config=Config(s3={'addressing_style': 'path'}),
          )
          client.create_bucket(
              Bucket='vintex-local-media',
              CreateBucketConfiguration={'LocationConstraint': 'us-east-2'},
          )
          PY

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            front-end/pnpm-lock.yaml

      - name: Instalar dependências do front-end e da suíte
        run: |
          pnpm install --frozen-lockfile --dir front-end
          pnpm install --frozen-lockfile --dir e2e

      # O Playwright transpila com esbuild, que descarta tipos sem conferir:
      # sem este passo, um campo errado no contrato só aparece como falha de
      # locator. Roda antes dos navegadores para falhar rápido.
      - name: Typecheck da suíte
        working-directory: e2e
        run: pnpm typecheck

      - name: Instalar navegadores do Playwright
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Rodar a suíte
        working-directory: e2e
        env:
          CI: 'true'
          # No CI não existe .venv: o comando da API usa o Python do runner.
          E2E_API_COMMAND: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
        run: pnpm exec playwright test --workers=2

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
