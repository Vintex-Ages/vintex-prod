name: Front-end CI

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * *"

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: front-end

jobs:
  # Escopo por tipo de PR:
  #   feature -> develop : só se o PR alterar o front-end (ou este workflow)
  #   develop -> qa      : todos os testes da aplicação
  #   qa -> main         : só infra; o front-end não tem infra, então dispensa
  #   push / manual / agenda : tudo
  changes:
    name: Detect front-end changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      front_end: ${{ steps.filter.outputs.front_end }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            echo "front_end=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" != "develop" ]; then
            echo "front_end=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          echo "$files"
          if echo "$files" | grep -qE '^(front-end/|\.github/workflows/front-end-ci\.yml$)'; then
            echo "front_end=true" >> "$GITHUB_OUTPUT"
          else
            echo "front_end=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mudança no front-end; CI do front-end dispensado."
          fi

  audit:
    name: Front-end audit
    needs: changes
    if: ${{ always() && (github.event_name == 'schedule' || needs.changes.outputs.front_end == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front-end/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit all dependencies
        run: pnpm audit --audit-level high

  quality:
    name: Front-end quality
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.front_end == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front-end/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm exec tsc --noEmit
      - name: Test application
        run: pnpm test
      - name: Test coverage
        run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: front-end/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: front-end/dist
          retention-days: 7

  # Aggregator for branch protection. Runs on every PR (no path filter), so the
  # required context is always reported.
  front-end-ci:
    name: Front-end CI
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [changes, audit, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require audit and quality
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONT_END: ${{ needs.changes.outputs.front_end }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONT_END" != "true" ]; then
            echo "Sem mudanças no front-end; audit e quality dispensados."
            exit 0
          fi
          test "$AUDIT_RESULT" = success
          test "$QUALITY_RESULT" = success
